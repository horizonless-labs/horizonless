name: Release

# Opens a "Version packages" PR from pending changesets; merging it publishes to npm.
# Publishing uses npm trusted publishing (OIDC): no npm token is stored in this repo.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1
      - run: npm install -g npm@^11.15.0
      - run: npm ci
      - run: npm run build
      - uses: changesets/action@v1
        with:
          publish: npx changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
